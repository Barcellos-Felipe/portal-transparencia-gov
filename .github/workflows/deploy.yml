name: Deploy frontend

on:
    push:
        branches: [ main ]

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                publish_branch: gh-pages
                publish_dir: frontend